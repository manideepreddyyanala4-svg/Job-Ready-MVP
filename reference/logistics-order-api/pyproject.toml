[project]
name = "logistics-order-api-reference"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
