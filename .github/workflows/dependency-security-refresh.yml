name: dependency-security-refresh

on:
  push:
    branches:
      - jobready-private-beta-polish
    paths:
      - .github/workflows/dependency-security-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jobready-private-beta-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Upgrade security-patched dependencies without force
        run: |
          npm install --save-exact next@16.4.3
          npm install --save-dev --save-exact eslint-config-next@16.4.3 vitest@4.1.12
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit lockfile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Upgrade security-patched Next.js and Vitest"
          git push origin HEAD:jobready-private-beta-polish
